name: Update publication cache

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Refresh publications from DBLP
        run: python new/scripts/update_publications.py

      - name: Commit changes when DBLP has new records
        run: |
          if git diff --quiet -- new/data/publications.js; then
            echo "Publication cache is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add new/data/publications.js
          git commit -m "Update publication cache"
          git push
